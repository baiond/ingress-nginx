name: Build and push ingress-nginx controller image

on:
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKER_ORG: ${{ vars.DOCKERHUB_USERNAME }}
  FORK_REPO: chainguard-forks/ingress-nginx
  # Platforms to build: amd64 only.
  BUILD_PLATFORMS: linux/amd64
  GO_PLATFORMS: amd64
  # THE knob: the controller minor lines we support. Every run auto-builds the
  # latest upstream controller-v<minor>.<patch> tag for each of these, so new
  # patches AND their (CVE-patched) nginx base images are picked up with zero
  # edits. Add a line here only when you want to start supporting a new minor.
  SUPPORTED_MINORS: "1.15"

jobs:
  prepare:
    name: "Resolve controller matrix"
    runs-on: self-hosted
    outputs:
      controller_matrix: ${{ steps.resolve.outputs.controller_matrix }}
      tag_suffix: ${{ steps.suffix.outputs.tag_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image tag suffix
        id: suffix
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Running on default branch ($BRANCH); images keep their normal tags."
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
          else
            sanitized=$(printf '%s' "$BRANCH" | sed 's#[^a-zA-Z0-9]#-#g; s#^-*##; s#-*$##')
            echo "Branch build ($BRANCH); suffixing every image tag with -${sanitized}"
            echo "tag_suffix=-${sanitized}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve controller matrix
        id: resolve
        env:
          FORK_REPO: ${{ env.FORK_REPO }}
          SUPPORTED_MINORS: ${{ env.SUPPORTED_MINORS }}
        run: |
          set -euo pipefail

          # Discover every controller-v* tag in the fork (no auth needed for a
          # public repo, and ls-remote avoids API pagination). Strip the
          # peeled "^{}" deref lines and any pre-release (-alpha/-beta) tags.
          all_tags=$(git ls-remote --tags "https://github.com/${FORK_REPO}.git" 'refs/tags/controller-v*' \
            | sed 's#.*refs/tags/##' | grep -v '\^{}' | grep -vE -- '-(alpha|beta|rc)')

          # For each supported minor line, take the newest patch.
          controller='[]'
          for minor in ${SUPPORTED_MINORS}; do
            latest=$(printf '%s\n' "$all_tags" \
              | grep -E "^controller-v${minor}\.[0-9]+$" \
              | sort -V | tail -1)
            if [ -z "$latest" ]; then
              echo "ERROR: no controller-v${minor}.* tag found upstream" >&2
              exit 1
            fi

            # Derive versions from the tag name, NOT the fork's internal files:
            # Chainguard sometimes leaves TAG/Chart.yaml stale on a tag (e.g.
            # controller-v1.15.10 still says appVersion 1.15.6). The tag name is
            # the authoritative, collision-free identifier.
            app_version="${latest#controller-v}"        # e.g. 1.15.10

            echo "minor ${minor} -> ${latest} (image v${app_version})"

            controller=$(jq -c --arg av "$app_version" --arg ref "$latest" \
              '. + [{app_version: $av, upstream_chart_tag: $ref}]' <<<"$controller")
          done

          echo "Resolved controller matrix:"
          jq . <<<"$controller"
          echo "controller_matrix={\"include\":${controller}}" >> "$GITHUB_OUTPUT"

  build-ingress-nginx:
    name: "Build controller v${{ matrix.app_version }}"
    runs-on: self-hosted
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      # Dynamically resolved by the prepare job: the latest upstream
      # controller-v<minor>.<patch> tag for each line in SUPPORTED_MINORS.
      matrix: ${{ fromJson(needs.prepare.outputs.controller_matrix) }}
    permissions:
      contents: read
      
    steps:
      - name: Checkout the fork repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ matrix.upstream_chart_tag }}

      - name: Configure Docker registry mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}
      
      - name: Extract metadata
        id: meta
        run: |
          # The controller image tag is the chart's appVersion, declared
          # authoritatively per-entry in the matrix. We deliberately do NOT
          # read the fork's TAG file here: Chainguard sometimes ships a chart
          # whose appVersion has moved on while TAG lags behind (e.g. chart
          # 4.15.7 bumps to v1.15.6 but leaves TAG at v1.15.5). Trusting TAG
          # would mislabel the image and clobber a prior version.
          VERSION="v${{ matrix.app_version }}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'GOLANG_VERSION'

      - name: Install mage
        run: go install github.com/magefile/mage@latest

      - name: Pre-pull build images via mirror.gcr.io
        run: |
          set -euo pipefail
          GO_VER=$(cat GOLANG_VERSION)
          ALPINE_TAG=$(grep -oE 'golang:\$\(GO_VERSION\)-alpine[0-9]+\.[0-9]+' Makefile | head -1 | sed 's/.*-alpine/alpine/')
          if [ -z "${ALPINE_TAG}" ]; then
            ALPINE_TAG="alpine3.22"
          fi
          IMAGE="golang:${GO_VER}-${ALPINE_TAG}"
          echo "Pre-pulling ${IMAGE} from mirror.gcr.io to avoid Docker Hub rate limits..."
          docker pull "mirror.gcr.io/library/${IMAGE}"
          docker tag "mirror.gcr.io/library/${IMAGE}" "${IMAGE}"
          docker tag "mirror.gcr.io/library/${IMAGE}" "docker.io/library/${IMAGE}"

      - name: Build and push controller image to Docker Hub
        env:
          TAG: ${{ steps.meta.outputs.version }}${{ needs.prepare.outputs.tag_suffix }}
          REGISTRY: ${{ env.REGISTRY }}/${{ env.DOCKER_ORG }}
        run: |
          set -euo pipefail
          echo "Building from fork: ${{ env.FORK_REPO }}@${{ matrix.upstream_chart_tag }}"
          echo "Pushing to: ${REGISTRY} (tag ${TAG})"

          # `make release` also builds controller-chroot, so run just the
          # controller parts of it: builder + clean, Go binaries, one image.
          make builder clean
          for arch in ${{ env.GO_PLATFORMS }}; do
            ARCH=${arch} make build
          done

          docker buildx build \
            --no-cache \
            --push \
            --pull \
            --progress plain \
            --platform ${{ env.BUILD_PLATFORMS }} \
            --build-arg BASE_IMAGE="$(cat NGINX_BASE)" \
            --build-arg VERSION="${TAG}" \
            --build-arg COMMIT_SHA="git-$(git rev-parse --short HEAD)" \
            --build-arg BUILD_ID="UNSET" \
            -t "${REGISTRY}/controller:${TAG}" rootfs

      - name: Generate build summary
        run: |
          VERSION=${{ steps.meta.outputs.version }}${{ needs.prepare.outputs.tag_suffix }}
          REGISTRY=${{ env.REGISTRY }}/${{ env.DOCKER_ORG }}
          
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** \`${{ env.FORK_REPO }}@${{ matrix.upstream_chart_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${{ steps.meta.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Org:** \`${{ env.DOCKER_ORG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Image" >> $GITHUB_STEP_SUMMARY
          echo "- \`${REGISTRY}/controller:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
